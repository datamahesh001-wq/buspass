<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BusPass</title>
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="user-phone-frame.css">
    <link rel="stylesheet" href="user-design-system.css">
    <script defer src="user-phone-frame.js"></script>
    <link rel="stylesheet" href="user-premium.css">
</head>
<body>
    <main class="reset-container">
        <div class="reset-brand"><i class="fa-solid fa-bus-simple"></i><span>BusPass</span></div>
        <section class="reset-card">
            <a class="back-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
            <div class="reset-icon"><i class="fa-solid fa-key"></i></div>
            <h1>Forgot Password?</h1>
            <p>Enter your registered email and we will send you an OTP.</p>
            <form id="emailForm" novalidate>
                <label for="email">Registered Email</label>
                <div class="input-wrap"><i class="fa-regular fa-envelope"></i><input id="email" type="email" placeholder="Enter your email" required></div>
                <p id="message" class="message"></p>
                <button type="submit">Send OTP <i class="fa-solid fa-arrow-right"></i></button>
            </form>
        </section>
    </main>
    <script src="forgot-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - BusPass</title><link rel="stylesheet" href="forgot-password.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="user-phone-frame.css">
    <link rel="stylesheet" href="user-design-system.css">
    <script defer src="user-phone-frame.js"></script>
    <link rel="stylesheet" href="user-premium.css">
</head>

<body><main class="reset-container"><div class="reset-brand"><i class="fa-solid fa-bus-simple"></i><span>BusPass</span></div><section class="reset-card"><a class="back-link" href="verify-otp.html"><i class="fa-solid fa-arrow-left"></i> Back</a><div class="reset-icon"><i class="fa-solid fa-lock"></i></div><h1>Create New Password</h1><p>Choose a strong password for your BusPass account.</p>
<form id="resetForm" novalidate><label for="newPassword">New Password</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="newPassword" type="password" placeholder="At least 8 characters" required><i class="fa-regular fa-eye" data-toggle="newPassword"></i></div><label for="confirmPassword">Confirm New Password</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="confirmPassword" type="password" placeholder="Re-enter password" required><i class="fa-regular fa-eye" data-toggle="confirmPassword"></i></div><p id="message" class="message"></p><button type="submit">Reset Password <i class="fa-solid fa-check"></i></button></form></section></main><script src="popup.js"></script><script src="reset-password.js"></script></body></html>

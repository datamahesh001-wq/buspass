<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password</title>
    <link rel="stylesheet" href="admin-forgot-password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="iphone-admin-frame.css">
  <link rel="stylesheet" href="admin-mobile-system.css">
    <link rel="stylesheet" href="admin-premium.css">
</head>
<body>
<div class="iphone-shell">
  <div class="iphone-screen">
    <div class="iphone-camera" aria-hidden="true"></div>
    <div class="iphone-app">

    <main class="reset-card">
        <a class="back-link" href="admin-login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a>
        <div class="icon"><i class="fa-solid fa-key"></i></div>
        <p class="eyebrow">ADMIN PORTAL</p>
        <h1>Reset password</h1>
        <p class="description">Enter your registered admin email. We will send a password-reset link.</p>
        <form id="resetForm" novalidate>
            <label for="resetEmail">Admin email</label>
            <input id="resetEmail" type="email" placeholder="admin@example.com" autocomplete="email" required>
            <p class="error" id="emailError" aria-live="polite"></p>
            <button type="submit" id="resetButton">Send reset link <i class="fa-solid fa-paper-plane"></i></button>
        </form>
        <p class="success" id="successMessage" aria-live="polite"></p>
    </main>
    <script src="admin-forgot-password.js"></script>
    </div>
  </div>
</div>
<script src="admin-phone-status.js"></script>
</body>
</html>

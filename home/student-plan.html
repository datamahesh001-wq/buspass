<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Plan - Bus Pass Application</title>

    <link rel="stylesheet" href="student-plan.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../user-phone-frame.css">
    <link rel="stylesheet" href="../user-design-system.css">
    <script defer src="../user-phone-frame.js"></script>
    <link rel="stylesheet" href="../user-premium.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">

        <button class="back-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="header-content">
            <h2 id="passTitle">Student Pass</h2>
            <p>Application Form</p>
        </div>

    </div>


    <!-- Progress -->
    <div class="progress-container">

        <div class="progress-step active">1</div>

        <div class="progress-line active"></div>

        <div class="progress-step active">2</div>

        <div class="progress-line active"></div>

        <div class="progress-step active">3</div>

        <div class="progress-line active"></div>

        <div class="progress-step active">4</div>

    </div>


    <!-- Plan Card -->
    <div class="plan-card">

        <h3>Pass Plan Selection</h3>

        <p class="subtitle">
            Choose a pass plan that suits you
        </p>


        <!-- Route Box -->
        <div class="route-box">

            <span class="route-label">
                Route
            </span>

            <strong id="routeSummary">
                Yanam Bus Stop → Kakinada Complex
            </strong>

            <span class="distance" id="routeDistance">
                Distance: 27 KM
            </span>

        </div>


        <!-- Monthly Plan -->
        <label class="plan-option selected">

            <input
                type="radio"
                name="plan"
                value="Monthly Pass"
                data-price="600"
                checked
                onchange="selectPlan(this)">

            <span class="radio-circle"></span>

            <div class="plan-details">

                <strong>Monthly Pass</strong>

                <small>
                    Validity for 30 days from the date of issue
                </small>

            </div>

            <span class="price">
                ₹600/-
            </span>

        </label>


        <!-- 3 Month -->
        <label class="plan-option">

            <input
                type="radio"
                name="plan"
                value="3 Monthly"
                data-price="1600"
                onchange="selectPlan(this)">

            <span class="radio-circle"></span>

            <div class="plan-details">

                <strong>3 Monthly</strong>

                <small>
                    Valid for 3 months from the date of issue
                </small>

            </div>

            <span class="price">
                ₹1,600/-
            </span>

        </label>


        <!-- Half Year -->
        <label class="plan-option">

            <input
                type="radio"
                name="plan"
                value="Half-Yearly Pass"
                data-price="3300"
                onchange="selectPlan(this)">

            <span class="radio-circle"></span>

            <div class="plan-details">

                <strong>Half - Yearly Pass</strong>

                <small>
                    Valid for 6 months from the date of issue
                </small>

            </div>

            <span class="price">
                ₹3,300/-
            </span>

        </label>


        <!-- Yearly -->
        <label class="plan-option">

            <input
                type="radio"
                name="plan"
                value="Yearly Pass"
                data-price="5500"
                onchange="selectPlan(this)">

            <span class="radio-circle"></span>

            <div class="plan-details">

                <strong>Yearly Pass</strong>

                <small>
                    Valid for 12 months from the date of issue
                </small>

            </div>

            <span class="price">
                ₹5,500/-
            </span>

        </label>


        <!-- Bottom Buttons -->
        <div class="bottom-buttons">

            <button
                type="button"
                class="back-button"
                onclick="goBack()">

                Back

            </button>


            <button
                type="button"
                class="next-button"
                onclick="goNext()">

                Next

            </button>

        </div>

    </div>

<div>


<script src="../popup.js"></script>

<script src="application-state.js"></script>
<script src="student-plan.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Route - Bus Pass Application</title>
    <link rel="stylesheet" href="employee-route.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../user-phone-frame.css">
    <link rel="stylesheet" href="../user-design-system.css">
    <script defer src="../user-phone-frame.js"></script>
    <link rel="stylesheet" href="../user-premium.css">
</head>
<body>
<div class="app employee-route-app">
    <div class="header">
        <button class="back-btn" type="button" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="header-content">
            <h2>Employee Pass</h2>
            <p>Application Form</p>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-step active">1</div>
        <div class="progress-line active"></div>
        <div class="progress-step active">2</div>
        <div class="progress-line active"></div>
        <div class="progress-step active">3</div>
        <div class="progress-line"></div>
        <div class="progress-step">4</div>
    </div>

    <main class="route-card">
        <h3>Office Route Selection</h3>
        <p class="subtitle">Select your home to office travel route</p>

        <section class="employee-summary" aria-label="Employee work details">
            <div class="employee-summary-title"><i class="fa-solid fa-building"></i> Employee Work Details</div>
            <div class="employee-summary-grid">
                <div><span>Organization</span><strong id="organizationValue">Not available</strong></div>
                <div><span>Employee ID</span><strong id="employeeIdValue">Not available</strong></div>
                <div class="designation-field"><span>Designation</span><strong id="designationValue">Not available</strong></div>
            </div>
        </section>

        <div class="field">
            <label for="fromStop">From Home Stop</label>
            <div class="select-box">
                <i class="fa-solid fa-location-dot"></i>
                <select id="fromStop">
                    <option value="">Select From Stop</option>
                </select>
                <i class="fa-solid fa-chevron-down arrow"></i>
            </div>
        </div>

        <button class="swap-btn" type="button" aria-label="Swap From and To stops" title="Swap route direction" onclick="swapStops()"><i class="fa-solid fa-right-left"></i></button>

        <div class="field to-field">
            <label for="toStop">To Office Stop</label>
            <div class="select-box">
                <i class="fa-solid fa-building"></i>
                <select id="toStop">
                    <option value="">Select To Stop</option>
                </select>
                <i class="fa-solid fa-chevron-down arrow"></i>
            </div>
        </div>

        <div class="bus-type-section">
            <h4>Bus Type</h4>
            <div class="bus-options">
                <label class="bus-option selected"><input type="radio" name="busType" value="Ordinary" checked onchange="selectBusType(this)"><span class="radio-circle"></span><div><strong>Ordinary</strong><small>Regular Service</small></div></label>
                <label class="bus-option"><input type="radio" name="busType" value="Express" onchange="selectBusType(this)"><span class="radio-circle"></span><div><strong>Express</strong><small>Limited Stop Service</small></div></label>
            </div>
        </div>
    </main>

    <div class="bottom-buttons">
        <button type="button" class="back-button" onclick="goBack()">Back</button>
        <button type="button" class="next-button" onclick="goNext()">Next</button>
    </div>
</div>
<script src="../popup.js"></script>
<script src="location-data.js"></script>
<script src="custom-dropdown.js"></script>
<script src="application-state.js"></script>
<script src="employee-route.js?v=20260917-3"></script>
</body>
</html>

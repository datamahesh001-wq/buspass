<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - BusPass</title><link rel="stylesheet" href="forgot-password.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="user-phone-frame.css">
    <link rel="stylesheet" href="user-design-system.css">
    <script defer src="user-phone-frame.js"></script>
    <link rel="stylesheet" href="user-premium.css">
</head>
<body><main class="reset-container"><div class="reset-brand"><i class="fa-solid fa-bus-simple"></i><span>BusPass</span></div><section class="reset-card">
    <a class="back-link" href="forgot-password.html"><i class="fa-solid fa-arrow-left"></i> Back</a><div class="reset-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>Verify OTP</h1><p>Enter the 6-digit code sent to your registered email.</p>
    <form id="otpForm" novalidate><label for="otp">One-Time Password</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" required></div><p id="message" class="message"></p><button type="submit">Verify OTP <i class="fa-solid fa-arrow-right"></i></button></form>
    <p class="timer">OTP expires in 10 minutes. <a id="resend" href="#">Resend OTP</a></p>
</section></main><script src="verify-otp.js"></script></body></html>
